## SLIMBOOK Executive-14-UC2 internal speakers.
##
## Fitted by the Omarchy Speaker Calibrator from a swept-sine measurement of
## the speakers with an external measuring microphone at the listening position. The sections and the limiter are in
## filter-chain.conf; the bass add-on, loudness compensation and volume
## following the plugin can add are deliberately not part of this tuning.

description="SLIMBOOK Executive-14-UC2 speakers"
## Deep bass is included: harmonics of the bass below the knee, made from built-in nodes.
## Matched on the DMI product SKU, compared as a whole value.
match_sku=("Executive-14-UC2")
## The internal speaker sink, as PipeWire names it on this machine.  Plain
## dots on purpose: Omarchy hands this to awk -v, which eats backslashes.
sink_pattern='^alsa_output.pci-0000_00_1f.3.analog-stereo$'

## Provenance.
derived_from="Omarchy Speaker Calibrator 1.2.0: sweep measurement with an external measuring microphone at the listening position, flat target, measured 2026-09-20; registry profile 2026-09-20-external-95d0f4e087, score 71"
validated_by=""   ## your name, once you have listened on the hardware named below
validated_on="2026-09-20"
validated_hardware="SLIMBOOK Executive-14-UC2 (Executive-14-UC2)"

## Measurements.
magnitude_rms_db="3.13"   ## against the calibrator's target, perceptually weighted
bass_group_delay_swing_ms="0.7"   ## from the biquad coefficients, 30-300 Hz
limiter_headroom_db="-0.1"   ## threshold (-1 dBFS) minus the peak of pink noise, 20 s, peaks at -0.1 dBFS after the chain and input gain
dynamic_range_delta_lu="0.0"   ## LRA after minus before on the same signal, ffmpeg ebur128
