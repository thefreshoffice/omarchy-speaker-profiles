## LENOVO 82Y5 internal speakers.
##
## Fitted by the Omarchy Speaker Calibrator from a swept-sine measurement of
## the speakers with an external measuring microphone at the listening position. The sections and the limiter are in
## filter-chain.conf; the bass add-on, loudness compensation and volume
## following the plugin can add are deliberately not part of this tuning.

description="LENOVO 82Y5 speakers"
## Deep bass is included: harmonics of the bass below the knee, made from built-in nodes.
## Matched on the DMI product SKU, compared as a whole value.
match_sku=("LENOVO_MT_82Y5_BU_idea_FM_Legion Slim 5 14APH8")
## The internal speaker sink, as PipeWire names it on this machine.  Plain
## dots on purpose: Omarchy hands this to awk -v, which eats backslashes.
sink_pattern='^alsa_output.pci-0000_05_00.6.analog-stereo$'

## Provenance.
derived_from="Omarchy Speaker Calibrator 1.2.0: sweep measurement with an external measuring microphone at the listening position, flat target, measured 2026-11-24; registry profile 2026-11-24-external-b17e862cba, score 71"
validated_by=""   ## your name, once you have listened on the hardware named below
validated_on="2026-11-24"
validated_hardware="LENOVO 82Y5 (LENOVO_MT_82Y5_BU_idea_FM_Legion Slim 5 14APH8)"

## Measurements.
magnitude_rms_db="4.58"   ## against the calibrator's target, perceptually weighted
bass_group_delay_swing_ms="0.7"   ## from the biquad coefficients, 30-300 Hz
limiter_headroom_db="0.5"   ## threshold (-1 dBFS) minus the peak of pink noise, 20 s, peaks at -0.1 dBFS after the chain and input gain
dynamic_range_delta_lu="0.1"   ## LRA after minus before on the same signal, ffmpeg ebur128
