## SAMSUNG ELECTRONICS CO., LTD. 950QED internal speakers.
##
## Fitted by the Omarchy Speaker Calibrator from a swept-sine measurement of
## the speakers with the built-in microphones. The sections and the limiter are in
## filter-chain.conf; the bass add-on, loudness compensation and volume
## following the plugin can add are deliberately not part of this tuning.

description="SAMSUNG ELECTRONICS CO., LTD. 950QED speakers"
## Deep bass is included: harmonics of the bass below the knee, made from built-in nodes.
## Matched on the DMI product SKU, compared as a whole value.
match_sku=("SCAI-ICPS-A5A5-ADLP-PAKK")
## The internal speaker sink, as PipeWire names it on this machine.  Plain
## dots on purpose: Omarchy hands this to awk -v, which eats backslashes.
sink_pattern='^alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink$'

## Provenance.
derived_from="Omarchy Speaker Calibrator 1.2.0: sweep measurement with the built-in microphones, flat target, measured 2026-09-26; registry profile 2026-09-26-builtin-b5d2cc222e, score 60"
validated_by=""   ## your name, once you have listened on the hardware named below
validated_on="2026-09-26"
validated_hardware="SAMSUNG ELECTRONICS CO., LTD. 950QED (SCAI-ICPS-A5A5-ADLP-PAKK)"

## Measurements.
magnitude_rms_db="3.82"   ## against the calibrator's target, perceptually weighted
bass_group_delay_swing_ms="1.1"   ## from the biquad coefficients, 30-300 Hz
limiter_headroom_db="0.6"   ## threshold (-1 dBFS) minus the peak of pink noise, 20 s, peaks at -0.1 dBFS after the chain and input gain
dynamic_range_delta_lu="-0.1"   ## LRA after minus before on the same signal, ffmpeg ebur128
