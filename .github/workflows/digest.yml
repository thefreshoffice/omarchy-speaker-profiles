name: Weekly summary

# One message a week instead of one for every submission: maintainers can set
# the repository to "Participating and @mentions" and still hear what arrived.
# Who is told is the repository variable DIGEST_MENTION, for example
# "@someone @another".  A week with nothing new sends nothing.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Write the summary and send it as one closed issue
        env:
          GH_TOKEN: ${{ github.token }}
          MENTION: ${{ vars.DIGEST_MENTION }}
        run: |
          python3 tools/digest.py --repository "$GITHUB_REPOSITORY" --days 7 --mention "$MENTION" > "$RUNNER_TEMP/digest.json"
          count=$(python3 -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["count"]))' "$RUNNER_TEMP/digest.json")
          if [ "$count" -eq 0 ]; then echo "Nothing new this week."; exit 0; fi
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); open(sys.argv[2],"w").write(d["title"]); open(sys.argv[3],"w").write(d["body"])' \
            "$RUNNER_TEMP/digest.json" "$RUNNER_TEMP/title.txt" "$RUNNER_TEMP/body.md"
          gh label create digest --repo "$GITHUB_REPOSITORY" --color ededed --description "Weekly summary" 2>/dev/null || true
          url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$(cat "$RUNNER_TEMP/title.txt")" \
                --body-file "$RUNNER_TEMP/body.md" --label digest)
          gh issue close "$url" --repo "$GITHUB_REPOSITORY"
