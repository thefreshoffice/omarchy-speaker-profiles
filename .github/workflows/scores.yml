name: Count votes

# A thumbs-up on a profile's submission is a vote for it.  Counted twice a day.
on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: registry-write
  cancel-in-progress: false

jobs:
  votes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - id: pin
        run: echo "commit=$(tr -cd '0-9a-f' < PLUGIN_COMMIT | head -c 40)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: thefreshoffice/omarchy-speaker-calibrator
          ref: ${{ steps.pin.outputs.commit }}
          path: .plugin
          persist-credentials: false
      - name: Install what rendering a vendor tuning needs
        # Not needed to publish: without it the registry files the calibration and keeps the tuning it has.
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-numpy python3-scipy ffmpeg
      - name: Count and rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/collect_votes.py "$GITHUB_REPOSITORY" "$RUNNER_TEMP/votes.json"
          python3 tools/registry.py votes --plugin .plugin --votes-file "$RUNNER_TEMP/votes.json"
      - name: Commit when something changed
        run: |
          git config user.name "speaker-profiles-bot"
          git config user.email "speaker-profiles-bot@users.noreply.github.com"
          git add profiles index tunings MODELS.md votes.json
          git diff --cached --quiet || { git commit -m "Update votes and scores"; git push origin HEAD:main; }
