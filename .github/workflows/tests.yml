name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: pin
        run: echo "commit=$(tr -cd '0-9a-f' < PLUGIN_COMMIT | head -c 40)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: thefreshoffice/omarchy-speaker-calibrator
          ref: ${{ steps.pin.outputs.commit }}
          path: .plugin
          persist-credentials: false
      - run: PLUGIN_DIR=.plugin python3 -m unittest discover -s tools -p "test_*.py" -v
